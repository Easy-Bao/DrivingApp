version: "2"

sql:
  - engine: "postgresql"
    schema: "db/schema"
    queries: "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
