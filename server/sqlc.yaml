version: "2"

sql:
  - engine: "postgresql"
    schema: "database/schema"
    queries: "database/query"
    gen:
      go:
        package: "postgres"
        out: "internal/platform/database/postgres"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
