name: DriveApp CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '17'

concurrency:
  group: driveapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build applications and services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp apps/passenger/.env.example apps/passenger/.env
          cp apps/driver/.env.example apps/driver/.env

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Build Passenger Android debug app
        working-directory: apps/passenger
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: flutter build apk --debug

      - name: Build Driver Android debug app
        working-directory: apps/driver
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: flutter build apk --debug

      - name: Build Go services
        working-directory: server
        run: go build ./...

  test:
    name: Test applications and services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: driveapp_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d driveapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify Go modules and generated queries
        working-directory: server
        run: |
          go mod tidy -diff
          go mod verify
          go tool sqlc generate
          git diff --exit-code -- internal/platform/database/sqlc
          go vet ./...

      - name: Test Go services with PostgreSQL and the race detector
        working-directory: server
        env:
          TEST_DATABASE_URL: "postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/driveapp_ci?sslmode=disable"
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/migrate
          go test -count=1 -shuffle=on -race -tags=integration ./...

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp apps/passenger/.env.example apps/passenger/.env
          cp apps/driver/.env.example apps/driver/.env

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Test Flutter apps and packages
        run: dart run melos exec -- "flutter test --reporter compact"
