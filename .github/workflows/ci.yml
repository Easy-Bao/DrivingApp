name: DriveApp Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: driveapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: git diff --check

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  mobile-quality-gate:
    name: Mobile Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter environment assets
        run: cp .env.example apps/driver_app/.env

      - name: Prepare passenger environment asset
        run: cp .env.example apps/passenger_app/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed apps packages

      - name: Analyze Flutter workspace
        run: dart run melos run analyze

      - name: Test driver app
        working-directory: apps/driver_app
        run: flutter test

      - name: Test passenger app
        working-directory: apps/passenger_app
        run: flutter test

  backend-quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Generate Ent client
        run: go generate ./ent/generate.go

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
