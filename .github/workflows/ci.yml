name: DriveApp CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

concurrency:
  group: driveapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build applications and services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp apps/passenger/.env.example apps/passenger/.env
          cp apps/driver/.env.example apps/driver/.env

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Build Passenger Android debug app
        working-directory: apps/passenger
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: flutter build apk --debug

      - name: Build Driver Android debug app
        working-directory: apps/driver
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: flutter build apk --debug

      - name: Build Go services
        working-directory: server
        run: go build ./...

  test:
    name: Test applications and services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp apps/passenger/.env.example apps/passenger/.env
          cp apps/driver/.env.example apps/driver/.env

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Test Flutter apps and packages
        run: dart run melos exec -- "flutter test --reporter compact"

      - name: Test Go services
        working-directory: server
        run: go test -count=1 -shuffle=on ./...
