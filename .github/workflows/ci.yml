name: DriveApp Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

concurrency:
  group: driveapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: git diff --check

      - name: Set up Gitleaks runtime
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install Gitleaks CLI
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan for leaked secrets
        run: ${{ runner.temp }}/gitleaks-bin/gitleaks git --no-banner --redact --log-opts=--all .

  mobile-format-and-boundaries:
    name: Mobile Format and Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: cp .env.example apps/driver/.env

      - name: Prepare passenger environment asset
        run: cp .env.example apps/passenger/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed apps packages

  mobile-analysis:
    name: Mobile Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp .env.example apps/driver/.env
          cp .env.example apps/passenger/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Analyze Flutter workspace
        run: dart run melos exec -- "flutter analyze --no-fatal-infos ."

  passenger-tests:
    name: Passenger Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp .env.example apps/driver/.env
          cp .env.example apps/passenger/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Test passenger app
        working-directory: apps/passenger
        run: flutter test --total-shards=2 --shard-index=${{ matrix.shard }} --reporter compact

  driver-tests:
    name: Driver Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp .env.example apps/driver/.env
          cp .env.example apps/passenger/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Test driver app
        working-directory: apps/driver
        run: flutter test --total-shards=2 --shard-index=${{ matrix.shard }} --reporter compact

  shared-package-tests:
    name: Shared Package Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [design_system, foundation, maps]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            apps/*/.dart_tool
            packages/*/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Prepare Flutter environment assets
        run: |
          cp .env.example apps/driver/.env
          cp .env.example apps/passenger/.env

      - name: Install root dependencies
        run: flutter pub get

      - name: Bootstrap Melos workspace
        run: dart run melos bootstrap

      - name: Test shared package
        working-directory: packages/${{ matrix.package }}
        run: flutter test --reporter compact

  backend-static:
    name: Backend Static Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Generate Ent client
        run: go generate ./ent/generate.go

      - name: Verify generated Ent client is current
        run: git diff --exit-code -- ent

      - name: Check Go module tidiness
        run: go mod tidy -diff

      - name: Vet Go packages
        run: go vet ./...

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Test Go packages
        run: go test -count=1 -shuffle=on ./...

  backend-race:
    name: Backend Race Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Test Go packages with race detector
        run: go test -count=1 -race ./...

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Test tagged integration packages
        run: go test -count=1 -tags=integration ./...

      - name: Test tagged integration packages with race detector
        run: go test -count=1 -race -tags=integration ./...

  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
