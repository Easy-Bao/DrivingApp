name: DriveApp Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: driveapp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
      backend: ${{ steps.scope.outputs.backend }}
      admin_web: ${{ steps.scope.outputs.admin_web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mobile=false
          backend=false
          admin_web=false

          if [[ "${EVENT_NAME}" == "push" ]]; then
            mobile=true
            backend=true
            admin_web=true
          else
            while IFS= read -r file; do
              case "${file}" in
                apps/*|packages/*|pubspec.yaml|melos.yaml|analysis_options.yaml)
                  mobile=true
                  ;;
                server/*)
                  backend=true
                  ;;
                web/admin_app/*)
                  admin_web=true
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi

          echo "mobile=${mobile}" >> "${GITHUB_OUTPUT}"
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "admin_web=${admin_web}" >> "${GITHUB_OUTPUT}"

  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository guards
        run: ./scripts/ci/quality_guard.sh

      - name: Scan for leaked secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --verbose --redact

  mobile-quality-gate:
    name: Mobile Quality Gate
    needs: change_scope
    if: needs.change_scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check formatting
        run: dart format --set-exit-if-changed apps packages

      - name: Analyze workspace
        run: melos run analyze

      - name: Test driver app
        working-directory: apps/driver_app
        run: flutter test

      - name: Test passenger app
        working-directory: apps/passenger_app
        run: flutter test

  backend-quality-gate:
    name: Backend Quality Gate
    needs: change_scope
    if: needs.change_scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install backend dependencies
        run: ./scripts/ci/install_backend_dependencies.sh

      - name: Prepare backend test environment
        run: ./scripts/ci/prepare_backend_test_env.sh

      - name: Generate Ent client
        working-directory: server
        run: go generate ./ent/generate.go

      - name: Vet backend
        run: ./scripts/ci/typecheck_backend_services.sh

      - name: Test backend
        run: ./scripts/ci/test_backend_services.sh

  admin_web_quality_gate:
    name: Admin Web Quality Gate
    needs: change_scope
    if: needs.change_scope.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Admin web
        run: bun run check

      - name: Test Admin web
        run: bun run test

      - name: Build Admin web
        run: bun run build

  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
