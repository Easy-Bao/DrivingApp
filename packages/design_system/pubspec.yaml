name: design_system
description: Shared UI primitives, components, and transitions used by both apps.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_svg: ^2.3.0
  flutter_lucide: ^1.8.2
  cached_network_image: ^4.0.7
  go_transitions: ^0.8.3
  animations: ^3.0.0
  foundation:
    path: ../foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/logo/


  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product_Sans_Bold_Italic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Product_Sans_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Product_Sans_Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Product_Sans_Regular.ttf
          weight: 400
          style: normal
