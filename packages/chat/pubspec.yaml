name: chat
description: Shared ride chat domain, realtime transport, state management, and UI widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  design_system:
    path: ../design_system
  foundation:
    path: ../foundation
  dio: ^5.10.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  flutter_lucide: '>=1.8.2 <=1.55.0'
  image_picker: ^1.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
