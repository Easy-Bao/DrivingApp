name: maps
description: Shared map, location, search, routing, and geospatial capabilities.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  design_system:
    path: ../design_system
  dio: ^5.10.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  foundation:
    path: ../foundation
  geolocator: ^14.0.3
  mapbox_maps_flutter: ^3.33.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mapbox_maps_flutter_platform_interface: ^3.33.0

flutter:
  uses-material-design: true
