services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: server/auth-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8088
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      postgres-db:
        condition: service_healthy

  passenger-service:
    build:
      context: .
      dockerfile: server/passenger-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8081
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      postgres-db:
        condition: service_healthy

  driver-service:
    build:
      context: .
      dockerfile: server/driver-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  trip-service:
    build:
      context: .
      dockerfile: server/trip-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  bidding-service:
    build:
      context: .
      dockerfile: server/bidding-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  telemetry-service:
    build:
      context: .
      dockerfile: server/telemetry-service/Dockerfile
    restart: always
    environment:
      PORT: 8085
      JWT_SECRET: ${JWT_SECRET}

  chat-service:
    build:
      context: .
      dockerfile: server/chat-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  fare-service:
    build:
      context: .
      dockerfile: server/fare-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      PORT: 8087
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  location-service:
    build:
      context: .
      dockerfile: server/location-service/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: 8089
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: server/api-gateway/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8088
      PASSENGER_SERVICE_URL: http://passenger-service:8081
      DRIVER_SERVICE_URL: http://driver-service:8082
      TRIP_SERVICE_URL: http://trip-service:8083
      BIDDING_SERVICE_URL: http://bidding-service:8084
      TELEMETRY_SERVICE_URL: http://telemetry-service:8085
      CHAT_SERVICE_URL: http://chat-service:8086
      FARE_SERVICE_URL: http://fare-service:8087
      LOCATION_SERVICE_URL: http://location-service:8089
    depends_on:
      - auth-service
      - passenger-service
      - driver-service
      - trip-service
      - bidding-service
      - telemetry-service
      - chat-service
      - fare-service
      - location-service

volumes:
  postgres_data:
