services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres-db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN-}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DriveApp}
      MAIL_SUBJECT: ${MAIL_SUBJECT:-DriveApp verification code}
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      FARE_RATE_LIMIT_REQUESTS_PER_MINUTE: ${FARE_RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE: ${TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      READ_RATE_LIMIT_REQUESTS_PER_MINUTE: ${READ_RATE_LIMIT_REQUESTS_PER_MINUTE:-300}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-16384}
      UPLOAD_BODY_LIMIT_BYTES: ${UPLOAD_BODY_LIMIT_BYTES:-10485760}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${POSTGRES_MAX_OPEN_CONNECTIONS:-25}
      POSTGRES_MAX_IDLE_CONNECTIONS: ${POSTGRES_MAX_IDLE_CONNECTIONS:-10}
      POSTGRES_CONNECTION_MAX_LIFETIME: ${POSTGRES_CONNECTION_MAX_LIFETIME:-30m}
      POSTGRES_CONNECTION_MAX_IDLE_TIME: ${POSTGRES_CONNECTION_MAX_IDLE_TIME:-5m}
      POSTGRES_PING_TIMEOUT: ${POSTGRES_PING_TIMEOUT:-5s}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-Asia/Manila}
      DOCUMENT_STORAGE_DIR: /var/lib/driveapp/documents
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - document-data:/var/lib/driveapp/documents

  admin-app:
    build:
      context: ./web/admin_app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${ADMIN_APP_PORT:-5173}:5173"
    environment:
      API_BASE_URL: http://api:8000
      ORIGIN: ${ADMIN_APP_ORIGIN:-http://localhost:5173}
      HOST: 0.0.0.0
      PORT: 5173
    depends_on:
      - api

volumes:
  postgres-data:
  document-data:
