services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PORT: ${REDIS_PORT}
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "$${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres-db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN-}
      REDIS_URL: redis://redis:${REDIS_PORT}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DriveApp}
      MAIL_SUBJECT: ${MAIL_SUBJECT:-DriveApp verification code}
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      FARE_RATE_LIMIT_REQUESTS_PER_MINUTE: ${FARE_RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE: ${TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      READ_RATE_LIMIT_REQUESTS_PER_MINUTE: ${READ_RATE_LIMIT_REQUESTS_PER_MINUTE:-300}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-16384}
      UPLOAD_BODY_LIMIT_BYTES: ${UPLOAD_BODY_LIMIT_BYTES:-10485760}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${POSTGRES_MAX_OPEN_CONNECTIONS:-25}
      POSTGRES_MAX_IDLE_CONNECTIONS: ${POSTGRES_MAX_IDLE_CONNECTIONS:-10}
      POSTGRES_CONNECTION_MAX_LIFETIME: ${POSTGRES_CONNECTION_MAX_LIFETIME:-30m}
      POSTGRES_CONNECTION_MAX_IDLE_TIME: ${POSTGRES_CONNECTION_MAX_IDLE_TIME:-5m}
      POSTGRES_PING_TIMEOUT: ${POSTGRES_PING_TIMEOUT:-5s}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-Asia/Manila}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${API_PORT}"

  admin-app:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${ADMIN_APP_HOST_PORT}:${ADMIN_APP_PORT}"
    environment:
      API_BASE_URL: http://api:${API_PORT}
      ORIGIN: ${ADMIN_APP_ORIGIN}
      HOST: 0.0.0.0
      PORT: ${ADMIN_APP_PORT}
    depends_on:
      - api

volumes:
  postgres-data:
