services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  core-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      CORE_API_PORT: 8080
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    depends_on:
      postgres-db:
        condition: service_healthy

  realtime-service:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["/app/realtime-service"]
    restart: always
    ports:
      - "${REALTIME_PORT:-8081}:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REALTIME_PORT: 8081
    depends_on:
      redis:
        condition: service_healthy

  admin-app:
    build:
      context: ./web/admin_app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${ADMIN_APP_PORT:-5173}:5173"
    environment:
      GATEWAY_URL: http://core-api:8080
      ORIGIN: ${ADMIN_APP_ORIGIN:-http://localhost:5173}
      HOST: 0.0.0.0
      PORT: 5173
    depends_on:
      - core-api
