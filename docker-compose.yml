services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PORT: ${REDIS_PORT}
    command:
      - redis-server
      - --port
      - "${REDIS_PORT}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --dir
      - /data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    container_name: minio
    build:
      context: server
      dockerfile: Dockerfile.minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-driveapp}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-driveapp-local-only-secret}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres-db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS-}
      JWT_SECRET: ${JWT_SECRET}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN-}
      REDIS_URL: redis://redis:${REDIS_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-driveapp}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-driveapp-local-only-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-private-objects}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MAIL_HOST: ${MAIL_HOST-}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME-}
      MAIL_PASSWORD: ${MAIL_PASSWORD-}
      MAIL_FROM: ${MAIL_FROM-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME-}
      MAIL_SUBJECT: ${MAIL_SUBJECT-}
      MAIL_SECURITY: ${MAIL_SECURITY-}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-}
      ENABLE_HSTS: ${ENABLE_HSTS-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS-}
      AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      REFRESH_RATE_LIMIT_REQUESTS_PER_MINUTE: ${REFRESH_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${LOCATION_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      FARE_RATE_LIMIT_REQUESTS_PER_MINUTE: ${FARE_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${CONNECTION_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE: ${TELEMETRY_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${MUTATION_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      READ_RATE_LIMIT_REQUESTS_PER_MINUTE: ${READ_RATE_LIMIT_REQUESTS_PER_MINUTE-}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES-}
      UPLOAD_BODY_LIMIT_BYTES: ${UPLOAD_BODY_LIMIT_BYTES-}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${POSTGRES_MAX_OPEN_CONNECTIONS-}
      POSTGRES_MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTIONS-}
      POSTGRES_MIN_IDLE_CONNECTIONS: ${POSTGRES_MIN_IDLE_CONNECTIONS-}
      POSTGRES_CONNECTION_MAX_LIFETIME: ${POSTGRES_CONNECTION_MAX_LIFETIME-}
      POSTGRES_CONNECTION_MAX_IDLE_TIME: ${POSTGRES_CONNECTION_MAX_IDLE_TIME-}
      POSTGRES_PING_TIMEOUT: ${POSTGRES_PING_TIMEOUT-}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE-}
      DRIVER_LOCATION_MAX_AGE: ${DRIVER_LOCATION_MAX_AGE-}
      PASSENGER_NO_SHOW_WAIT: ${PASSENGER_NO_SHOW_WAIT-}
      RIDE_ARRIVAL_RADIUS_METERS: ${RIDE_ARRIVAL_RADIUS_METERS-}
      RIDE_COMPLETION_RADIUS_METERS: ${RIDE_COMPLETION_RADIUS_METERS-}
      BID_SESSION_DURATION: ${BID_SESSION_DURATION-}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_PORT}:${API_PORT}"

  objectstorage-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: "no"
    entrypoint: ["/app/objectstorage-migrate"]
    profiles: ["ops"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-driveapp}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-driveapp-local-only-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-private-objects}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${POSTGRES_MAX_OPEN_CONNECTIONS-}
      POSTGRES_MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTIONS-}
      POSTGRES_MIN_IDLE_CONNECTIONS: ${POSTGRES_MIN_IDLE_CONNECTIONS-}
      POSTGRES_CONNECTION_MAX_LIFETIME: ${POSTGRES_CONNECTION_MAX_LIFETIME-}
      POSTGRES_CONNECTION_MAX_IDLE_TIME: ${POSTGRES_CONNECTION_MAX_IDLE_TIME-}
      POSTGRES_PING_TIMEOUT: ${POSTGRES_PING_TIMEOUT-}
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin-app:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${ADMIN_APP_HOST_PORT}:${ADMIN_APP_PORT}"
    environment:
      API_BASE_URL: http://api:${API_PORT}
      ORIGIN: ${ADMIN_APP_ORIGIN}
      HOST: 0.0.0.0
      PORT: ${ADMIN_APP_PORT}
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
