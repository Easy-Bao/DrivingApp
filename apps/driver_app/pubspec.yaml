name: driver_app
description: "EasyRide Driver App by ZervX"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  go_router_modular: ^5.0.5

  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  json_annotation: ^4.9.0

  get_it: ^9.2.1
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2

  flutter_lucide: ^1.8.2
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3

  mapbox_maps_flutter: ^2.23.0
  geolocator: ^14.0.3
  map_launcher: ^6.0.0
  flutter_polyline_points: ^3.1.0
  permission_handler: ^12.0.3
  shared_core:
    path: ../../packages/shared_core

  auth:
    path: ../../packages/auth
  maps:
    path: ../../packages/maps
  ride:
    path: ../../packages/ride
  chat:
    path: ../../packages/chat
  foundation:
    path: ../../packages/foundation

  design_system:
    path: ../../packages/design_system

  fpdart: ^1.2.0
  dio: ^5.10.0
  rxdart: ^0.28.0
  flutter_secure_storage: ^10.3.1
  flutter_background_service: ^5.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  json_serializable: ^6.9.4
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  image_path: "assets/app-icon/easy-ride.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
