targets:
  $default:
    builders:
      source_gen|combining_builder:
        options:
          build_extensions:
            '^lib/src/{{path}}/{{file}}.dart': 'lib/src/{{path}}/generated/{{file}}.g.dart'
      freezed|freezed:
        options:
          build_extensions:
            '^lib/src/{{path}}/{{file}}.dart': 'lib/src/{{path}}/generated/{{file}}.freezed.dart'
