name: driver
description: "EasyRide Driver App by ZervX"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter

  go_router_modular: ^5.0.5

  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2

  flutter_lucide: ^1.8.2
  image_picker: ^1.2.3
  skeletonizer: ^2.1.3

  mapbox_maps_flutter: ^2.23.0
  geolocator: ^14.0.3
  maps:
    path: ../../packages/maps
  foundation:
    path: ../../packages/foundation

  design_system:
    path: ../../packages/design_system

  dio: ^5.10.0
  sentry_flutter: ^9.30.0
  sentry_dio: ^9.30.0
  rxdart: ^0.28.0
  flutter_secure_storage: ^10.3.1
  flutter_background_service: ^5.1.0
  fl_chart: ^1.2.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
